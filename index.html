<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ទូរទស្សន៍ IPTV និងស្ថានីយផ្ទាល់ខ្លួន</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Khmer OS","Noto Sans Khmer",system-ui,sans-serif;background:#0d1117;color:#e6edf3}
header{display:flex;gap:8px;padding:10px;background:#161b22;position:sticky;top:0;z-index:5}
header button{flex:1;padding:12px;border:0;border-radius:8px;background:#21262d;color:#e6edf3;font-size:16px}
header button.on{background:#e50914}
main{padding:10px;max-width:1000px;margin:auto}
.hide{display:none}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.stage video,.stage iframe,.stage img.m{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0;background:#000}
#logo{position:absolute;top:8px;right:8px;max-height:15%;max-width:20%;z-index:3}
#ad{position:absolute;left:8px;bottom:34px;max-height:28%;max-width:35%;z-index:3;border-radius:6px;border:2px solid #fff}
.tick{position:absolute;left:0;right:0;bottom:0;height:28px;background:rgba(200,0,0,.85);overflow:hidden;z-index:4;white-space:nowrap}
.tick span{display:inline-block;padding-left:100%;line-height:28px;font-weight:bold;animation:t 15s linear infinite}
@keyframes t{to{transform:translateX(-100%)}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
select,input[type=text],input[type=search],input[type=number],textarea{flex:1;min-width:120px;padding:10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:15px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#238636;color:#fff;font-size:15px;cursor:pointer}
.btn.r{background:#da3633}.btn.b{background:#1f6feb}
.list{max-height:320px;overflow:auto;background:#161b22;border-radius:8px}
.list div{padding:10px;border-bottom:1px solid #21262d;cursor:pointer}
.list div:hover{background:#21262d}
h3{margin:18px 0 6px}
.items div{display:flex;align-items:center;gap:8px;padding:6px;background:#161b22;margin:4px 0;border-radius:8px}
.items img{width:48px;height:36px;object-fit:cover;border-radius:4px}
.items span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:#8b949e}
</style>
</head>
<body>
<header>
  <button id="t1" class="on" onclick="tab(1)">📺 ទូរទស្សន៍ពិភពលោក</button>
  <button id="t2" onclick="tab(2)">🎬 ស្ថានីយខ្ញុំ</button>
</header>
<main>

<!-- TAB 1 -->
<section id="p1">
  <div class="stage"><video id="tv" controls autoplay playsinline></video></div>
  <p id="now"><small>ជ្រើសប៉ុស្តិ៍ខាងក្រោម</small></p>
  <div class="row">
    <select id="country" onchange="loadCountry()"></select>
    <input type="search" id="q" placeholder="ស្វែងរកប៉ុស្តិ៍..." oninput="renderList()">
  </div>
  <div class="list" id="list"></div>
</section>

<!-- TAB 2 -->
<section id="p2" class="hide">
  <div class="stage" id="stage">
    <div id="screen"></div>
    <img id="logo" class="hide" alt="">
    <img id="ad" class="hide" alt="">
    <div class="tick hide" id="tick"><span id="tickt"></span></div>
  </div>
  <div class="row">
    <button class="btn" onclick="startST()">▶ ចាក់ផ្សាយ</button>
    <button class="btn r" onclick="stopST()">⏹ ឈប់</button>
    <button class="btn b" onclick="document.getElementById('stage').requestFullscreen&&document.getElementById('stage').requestFullscreen()">⛶ ពេញអេក្រង់</button>
  </div>

  <h3>🏷️ Logo ស្ថានីយ</h3>
  <input type="file" accept="image/*" onchange="setLogo(this)">

  <h3>🖼️ រូបថត / 🎞️ វីដេអូ ពីទូរស័ព្ទ</h3>
  <input type="file" accept="image/*,video/*" multiple onchange="addFiles(this)">
  <div class="row"><input type="number" id="dur" value="8" min="2"><small style="align-self:center">វិនាទី/រូបថត</small></div>

  <h3>▶️ តំណ YouTube</h3>
  <div class="row">
    <input type="text" id="yt" placeholder="https://youtube.com/watch?v=...">
    <input type="number" id="ytd" value="60" min="5" title="រយៈពេល(វិនាទី)">
    <button class="btn b" onclick="addYT()">បន្ថែម</button>
  </div>
  <div class="items" id="items"></div>

  <h3>📢 ពាណិជ្ជកម្ម (រូបថត)</h3>
  <input type="file" accept="image/*" multiple onchange="addAds(this)">
  <div class="items" id="ads"></div>

  <h3>📝 អក្សរហូរ</h3>
  <textarea id="txt" rows="2" placeholder="សរសេរអត្ថបទអក្សរហូរនៅទីនេះ..." oninput="setTick()"></textarea>
  <div class="row"><small>ល្បឿន (វិនាទី):</small><input type="number" id="spd" value="15" min="4" oninput="setTick()"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const C={kh:'🇰🇭 កម្ពុជា',cn:'🇨🇳 ចិន',vn:'🇻🇳 វៀតណាម',la:'🇱🇦 ឡាវ',mm:'🇲🇲 មីយ៉ាន់ម៉ា',sg:'🇸🇬 សិង្ហបុរី',jp:'🇯🇵 ជប៉ុន',kr:'🇰🇷 កូរ៉េខាងត្បូង',kp:'🇰🇵 កូរ៉េខាងជើង',us:'🇺🇸 សហរដ្ឋអាមេរិក',ru:'🇷🇺 រុស្ស៊ី',ua:'🇺🇦 អ៊ុយក្រែន',sy:'🇸🇾 ស៊ីរី',za:'🇿🇦 អាហ្វ្រិកខាងត្បូង',iq:'🇮🇶 អ៊ីរ៉ាក់',ir:'🇮🇷 អ៊ីរ៉ង់',il:'🇮🇱 អ៊ីស្រាអែល',se:'🇸🇪 ស៊ុយអែត',in:'🇮🇳 ឥណ្ឌា',tw:'🇹🇼 តៃវ៉ាន់',id:'🇮🇩 ឥណ្ឌូនេស៊ី',ph:'🇵🇭 ហ្វីលីពីន',my:'🇲🇾 ម៉ាឡេស៊ី',eng:'🇬🇧 អង់គ្លេស (ភាសា)',es:'🇪🇸 អេស្ប៉ាញ',qa:'🇶🇦 កាតា'};
const SRV={kh:'cambodia',mm:'myanmar',in:'indian',cn:'chinese',tw:'taiwan',id:'indonesia',ru:'russian',ph:'philippines',my:'malaysian',jp:'japanese',us:'america',eng:'english',es:'spain',ua:'ukraine',ir:'iran',iq:'iraq',qa:'qatar',vn:'vietnam',la:'laos',sg:'singapore',kr:'southkorea',kp:'northkorea',sy:'syria',za:'southafrica',il:'israel',se:'sweden'};
$('country').innerHTML=Object.entries(C).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
let chans=[],hls;
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)$('tv').pause()}

async function loadCountry(){
  $('list').innerHTML='<div>កំពុងផ្ទុក...</div>';
  try{
    const k=$('country').value;let r=null;
    if(SRV[k]&&location.protocol.startsWith('http')){try{r=await fetch(`/playlist/${SRV[k]}.m3u8`);if(!r.ok)r=null}catch(e){r=null}}
    if(!r){r=await fetch(`https://iptv-org.github.io/iptv/${k=='eng'?'languages':'countries'}/${k}.m3u`)}
    if(!r.ok)throw 0;
    const t=await r.text(),L=t.split('\n');chans=[];
    for(let i=0;i<L.length;i++){
      if(L[i].startsWith('#EXTINF')){
        const name=L[i].split(',').pop().trim();
        let j=i+1;while(L[j]&&L[j].startsWith('#'))j++;
        if(L[j]&&L[j].startsWith('http'))chans.push({name,url:L[j].trim()});
      }
    }
  }catch(e){chans=[]}
  renderList();
}
function renderList(){
  const q=$('q').value.toLowerCase();
  const f=chans.filter(c=>c.name.toLowerCase().includes(q));
  $('list').innerHTML=f.length?'':'<div>គ្មានប៉ុស្តិ៍ទេ</div>';
  f.forEach(c=>{const d=document.createElement('div');d.textContent='📺 '+c.name;d.onclick=()=>play(c);$('list').appendChild(d)});
}
function play(c){
  const v=$('tv');$('now').innerHTML='កំពុងចាក់: <b></b>';$('now').querySelector('b').textContent=c.name;
  if(hls){hls.destroy();hls=null}
  if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$('now').innerHTML='<small>⚠️ ប៉ុស្តិ៍នេះមិនអាចចាក់បាន សូមសាកល្បងប៉ុស្តិ៍ផ្សេង</small>'})}
  else v.src=c.url;
  v.play().catch(()=>{});
}
loadCountry();

/* ===== My Station ===== */
let items=[],ads=[],timer,adTimer,idx=0,running=false;
function setLogo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('logo').src=r.result;$('logo').classList.remove('hide');try{localStorage.setItem('logo',r.result)}catch(e){}};r.readAsDataURL(f)}
function addFiles(i){[...i.files].forEach(f=>items.push({type:f.type.startsWith('video')?'vid':'img',src:URL.createObjectURL(f),name:f.name}));i.value='';draw()}
function addAds(i){[...i.files].forEach(f=>ads.push({src:URL.createObjectURL(f),name:f.name}));i.value='';draw()}
function addYT(){
  const u=$('yt').value.trim();
  const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if(!m){alert('តំណ YouTube មិនត្រឹមត្រូវ');return}
  items.push({type:'yt',src:m[1],name:'YouTube: '+m[1],dur:+$('ytd').value||60});$('yt').value='';draw();
}
function draw(){
  $('items').innerHTML='';$('ads').innerHTML='';
  items.forEach((it,i)=>{const d=document.createElement('div');
    d.innerHTML=(it.type=='img'?`<img src="${it.src}">`:it.type=='vid'?'🎞️':'▶️')+'<span></span><button class="btn r">✕</button>';
    d.querySelector('span').textContent=it.name;d.querySelector('button').onclick=()=>{items.splice(i,1);draw()};$('items').appendChild(d)});
  ads.forEach((it,i)=>{const d=document.createElement('div');
    d.innerHTML=`<img src="${it.src}"><span></span><button class="btn r">✕</button>`;
    d.querySelector('span').textContent=it.name;d.querySelector('button').onclick=()=>{ads.splice(i,1);draw()};$('ads').appendChild(d)});
}
function setTick(){
  const t=$('txt').value.trim();
  try{localStorage.setItem('txt',t)}catch(e){}
  $('tick').classList.toggle('hide',!t);$('tickt').textContent=t;
  $('tickt').style.animationDuration=($('spd').value||15)+'s';
}
function next(){
  if(!running||!items.length)return;
  const it=items[idx%items.length];idx++;
  const s=$('screen');s.innerHTML='';
  if(it.type=='img'){s.innerHTML=`<img class="m" src="${it.src}">`;timer=setTimeout(next,(+$('dur').value||8)*1000)}
  else if(it.type=='vid'){const v=document.createElement('video');v.src=it.src;v.autoplay=true;v.playsInline=true;v.controls=false;v.onended=next;v.onerror=next;s.appendChild(v);v.play().catch(()=>{})}
  else{s.innerHTML=`<iframe src="https://www.youtube.com/embed/${it.src}?autoplay=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;timer=setTimeout(next,it.dur*1000)}
}
function startST(){
  if(!items.length){alert('សូមបន្ថែមរូបថត វីដេអូ ឬ YouTube មុន');return}
  stopST();running=true;idx=0;setTick();next();
  let a=0;
  const showAd=()=>{const el=$('ad');if(!ads.length){el.classList.add('hide');return}
    el.src=ads[a++%ads.length].src;el.classList.remove('hide')};
  showAd();adTimer=setInterval(showAd,10000);
}
function stopST(){running=false;clearTimeout(timer);clearInterval(adTimer);$('screen').innerHTML='';$('ad').classList.add('hide')}
try{const l=localStorage.getItem('logo');if(l){$('logo').src=l;$('logo').classList.remove('hide')}
const t=localStorage.getItem('txt');if(t){$('txt').value=t;setTick()}}catch(e){}
</script>
</body>
</html>
