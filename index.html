<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ទូរទស្សន៍ IPTV និងស្ថានីយផ្ទាល់ខ្លួន</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Khmer OS","Noto Sans Khmer",system-ui,sans-serif;background:#0d1117;color:#e6edf3}
header{display:flex;gap:8px;padding:10px;background:#161b22;position:sticky;top:0;z-index:5}
header button{flex:1;padding:12px;border:0;border-radius:8px;background:#21262d;color:#e6edf3;font-size:16px}
header button.on{background:#e50914}
main{padding:10px;max-width:1000px;margin:auto}
.hide{display:none}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.stage video,.stage iframe,.stage img.m{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0;background:#000}
#logo{position:absolute;top:8px;right:8px;max-height:15%;max-width:20%;z-index:3}
#ad{position:absolute;left:8px;bottom:34px;max-height:28%;max-width:35%;z-index:3;border-radius:6px;border:2px solid #fff}
.tick{position:absolute;left:0;right:0;bottom:0;height:28px;background:rgba(200,0,0,.85);overflow:hidden;z-index:4;white-space:nowrap}
.tick span{display:inline-block;padding-left:100%;line-height:28px;font-weight:bold;animation:t 15s linear infinite}
@keyframes t{to{transform:translateX(-100%)}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
select,input[type=text],input[type=search],input[type=number],textarea{flex:1;min-width:120px;padding:10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:15px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#238636;color:#fff;font-size:15px;cursor:pointer}
.btn.r{background:#da3633}.btn.b{background:#1f6feb}
.list{max-height:320px;overflow:auto;background:#161b22;border-radius:8px}
.list div{padding:10px;border-bottom:1px solid #21262d;cursor:pointer}
.list div:hover{background:#21262d}
h3{margin:18px 0 6px}
.items div{display:flex;align-items:center;gap:8px;padding:6px;background:#161b22;margin:4px 0;border-radius:8px}
.items img{width:48px;height:36px;object-fit:cover;border-radius:4px}
.items span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{color:#8b949e}
</style>
</head>
<body>
<header>
  <button id="t1" class="on" onclick="tab(1)">📺 ទូរទស្សន៍ពិភពលោក</button>
  <button id="t2" onclick="tab(2)">🎬 ស្ថានីយខ្ញុំ</button>
</header>
<main>

<section id="p1">
  <div class="stage"><video id="tv" controls autoplay playsinline></video></div>
  <p id="now"><small>ជ្រើសប៉ុស្តិ៍ខាងក្រោម</small></p>
  <div class="row">
    <select id="country" onchange="loadCountry()"></select>
    <input type="search" id="q" placeholder="ស្វែងរកប៉ុស្តិ៍..." oninput="renderList()">
  </div>
  <div class="list" id="list"></div>
</section>

<section id="p2" class="hide">
  <div class="stage" id="stage">
    <div id="screen"></div>
    <img id="logo" class="hide" alt="">
    <img id="ad" class="hide" alt="">
    <div class="tick hide" id="tick"><span id="tickt"></span></div>
  </div>
  <div class="row">
    <button class="btn" onclick="startST()">▶ ចាក់ផ្សាយ</button>
    <button class="btn r" onclick="stopST()">⏹ ឈប់</button>
    <button class="btn b" onclick="document.getElementById('stage').requestFullscreen&&document.getElementById('stage').requestFullscreen()">⛶ ពេញអេក្រង់</button>
  </div>
  <div class="card" style="background:#161b22;border-radius:10px;padding:10px;margin-top:12px">
    <div class="row">
      <input type="text" id="who" placeholder="បញ្ចូល Gmail របស់អ្នកដើម្បីចុះឈ្មោះ" autocomplete="off">
      <button class="btn" onclick="join()">យល់ព្រម</button>
    </div>
    <small id="msg">ការចុះឈ្មោះរក្សាទុកតែ Gmail របស់អ្នកលើឧបករណ៍នេះប៉ុណ្ណោះ។</small>
  </div>

  <div id="adm" class="hide">
  <p><small id="store">💾 កំពុងពិនិត្យទំហំផ្ទុក...</small></p>
  <div class="row">
    <button class="btn b" onclick="exportBK()">💾 បម្រុងទុក (Export)</button>
    <button class="btn" onclick="document.getElementById('bk').click()">📂 ស្ដារ (Import)</button>
    <input type="file" id="bk" accept=".tvbackup" class="hide" onchange="importBK(this)">
  </div>

  <h3>🏷️ Logo ស្ថានីយ</h3>
  <input type="file" accept="image/*" onchange="setLogo(this)">

  <h3>🖼️ រូបថត / 🎞️ វីដេអូ ពីទូរស័ព្ទ</h3>
  <input type="file" accept="image/*,video/*" multiple onchange="addFiles(this)">
  <div class="row"><input type="number" id="dur" value="8" min="2"><small style="align-self:center">វិនាទី/រូបថត</small></div>

  <h3>▶️ តំណ YouTube</h3>
  <div class="row">
    <input type="text" id="yt" placeholder="https://youtube.com/watch?v=...">
    <input type="number" id="ytd" value="60" min="5" title="រយៈពេល(វិនាទី)">
    <button class="btn b" onclick="addYT()">បន្ថែម</button>
  </div>
  <div class="items" id="items"></div>

  <h3>📢 ពាណិជ្ជកម្ម (រូបថត)</h3>
  <input type="file" accept="image/*" multiple onchange="addAds(this)">
  <div class="items" id="ads"></div>

  <h3>📝 អក្សរហូរ</h3>
  <textarea id="txt" rows="2" placeholder="សរសេរអត្ថបទអក្សរហូរនៅទីនេះ..." oninput="setTick()"></textarea>
  <div class="row"><small>ល្បឿន (វិនាទី):</small><input type="number" id="spd" value="15" min="4" oninput="setTick()"></div>
  <h3>👥 អ្នកចុះឈ្មោះ (លើឧបករណ៍នេះ)</h3>
  <button class="btn b" onclick="showUsers()">បង្ហាញបញ្ជី</button>
  <div class="list" id="users"></div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const C={kh:'🇰🇭 កម្ពុជា',cn:'🇨🇳 ចិន',vn:'🇻🇳 វៀតណាម',la:'🇱🇦 ឡាវ',mm:'🇲🇲 មីយ៉ាន់ម៉ា',sg:'🇸🇬 សិង្ហបុរី',jp:'🇯🇵 ជប៉ុន',kr:'🇰🇷 កូរ៉េខាងត្បូង',kp:'🇰🇵 កូរ៉េខាងជើង',us:'🇺🇸 សហរដ្ឋអាមេរិក',ru:'🇷🇺 រុស្ស៊ី',ua:'🇺🇦 អ៊ុយក្រែន',sy:'🇸🇾 ស៊ីរី',za:'🇿🇦 អាហ្វ្រិកខាងត្បូង',iq:'🇮🇶 អ៊ីរ៉ាក់',ir:'🇮🇷 អ៊ីរ៉ង់',il:'🇮🇱 អ៊ីស្រាអែល',se:'🇸🇪 ស៊ុយអែត',in:'🇮🇳 ឥណ្ឌា',tw:'🇹🇼 តៃវ៉ាន់',id:'🇮🇩 ឥណ្ឌូនេស៊ី',ph:'🇵🇭 ហ្វីលីពីន',my:'🇲🇾 ម៉ាឡេស៊ី',eng:'🇬🇧 អង់គ្លេស (ភាសា)',es:'🇪🇸 អេស្ប៉ាញ',qa:'🇶🇦 កាតា'};
const SRV={kh:'cambodia',mm:'myanmar',in:'indian',cn:'chinese',tw:'taiwan',id:'indonesia',ru:'russian',ph:'philippines',my:'malaysian',jp:'japanese',us:'america',eng:'english',es:'spain',ua:'ukraine',ir:'iran',iq:'iraq',qa:'qatar',vn:'vietnam',la:'laos',sg:'singapore',kr:'southkorea',kp:'northkorea',sy:'syria',za:'southafrica',il:'israel',se:'sweden'};
$('country').innerHTML=Object.entries(C).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
let chans=[],hls;
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)$('tv').pause()}

async function loadCountry(){
  $('list').innerHTML='<div>កំពុងផ្ទុក...</div>';
  try{
    const k=$('country').value;let r=null;
    if(SRV[k]&&location.protocol.startsWith('http')){try{r=await fetch(`/playlist/${SRV[k]}.m3u8`);if(!r.ok)r=null}catch(e){r=null}}
    if(!r){r=await fetch(`https://iptv-org.github.io/iptv/${k=='eng'?'languages':'countries'}/${k}.m3u`)}
    if(!r.ok)throw 0;
    const L=(await r.text()).split('\n');chans=[];
    for(let i=0;i<L.length;i++){
      if(L[i].startsWith('#EXTINF')){
        const name=L[i].split(',').pop().trim();
        let j=i+1;while(L[j]&&L[j].startsWith('#'))j++;
        if(L[j]&&L[j].startsWith('http'))chans.push({name,url:L[j].trim()});
      }
    }
  }catch(e){chans=[]}
  renderList();
}
function renderList(){
  const q=$('q').value.toLowerCase();
  const f=chans.filter(c=>c.name.toLowerCase().includes(q));
  $('list').innerHTML=f.length?'':'<div>គ្មានប៉ុស្តិ៍ទេ</div>';
  f.forEach(c=>{const d=document.createElement('div');d.textContent='📺 '+c.name;d.onclick=()=>play(c);$('list').appendChild(d)});
}
function play(c){
  const v=$('tv');$('now').innerHTML='កំពុងចាក់: <b></b>';$('now').querySelector('b').textContent=c.name;
  if(hls){hls.destroy();hls=null}
  if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$('now').innerHTML='<small>⚠️ ប៉ុស្តិ៍នេះមិនអាចចាក់បាន សូមសាកល្បងប៉ុស្តិ៍ផ្សេង</small>'})}
  else v.src=c.url;
  v.play().catch(()=>{});
}
loadCountry();

/* ===== ស្ថានីយខ្ញុំ ===== */
let items=[],ads=[],timer,adTimer,idx=0,running=false;
function setLogo(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('logo').src=r.result;$('logo').classList.remove('hide');try{localStorage.setItem('logo',r.result)}catch(e){}};r.readAsDataURL(f)}

/* ---- ឃ្លាំងផ្ទុកអចិន្ត្រៀយ៍ (IndexedDB) ---- */
let db;
const idb=(mode,fn)=>new Promise((res,rej)=>{const q=fn(db.transaction('m',mode).objectStore('m'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const dbPut=o=>idb('readwrite',s=>s.add(o)), dbDel=id=>idb('readwrite',s=>s.delete(id)), dbAll=()=>idb('readonly',s=>s.getAll());
async function saveFiles(files,kind){
  for(const f of files){
    const o={kind,type:kind=='ad'?'img':f.type.startsWith('video')?'vid':'img',name:f.name,blob:f};
    try{o.id=await dbPut(o)}catch(e){alert('⚠️ ទំហំផ្ទុកពេញ ឬមិនអាចរក្សាទុក៖ '+f.name);continue}
    const v={id:o.id,type:o.type,name:o.name,src:URL.createObjectURL(f)};
    (kind=='ad'?ads:items).push(v);
  }
  draw();showStore();
}
function addFiles(i){const f=[...i.files];i.value='';saveFiles(f,'item')}
function addAds(i){const f=[...i.files];i.value='';saveFiles(f,'ad')}
async function showStore(){
  try{
    const e=await navigator.storage.estimate(),p=navigator.storage.persisted?await navigator.storage.persisted():false;
    const g=n=>n>=1e9?(n/1e9).toFixed(2)+' GB':(n/1e6).toFixed(1)+' MB';
    $('store').textContent=`💾 ប្រើ ${g(e.usage)} / អាចប្រើបាន ${g(e.quota)} · ការការពារមិនឲ្យលុប៖ ${p?'✅ បើក':'⚠️ មិនទាន់បើក'}`;
  }catch(e){$('store').textContent='💾 កម្មវិធីរុករកនេះមិនបង្ហាញទំហំផ្ទុក'}
}
/* ---- បម្រុងទុក / ស្ដារ (.tvbackup) ---- */
const enc=new TextEncoder(),dec=new TextDecoder();
async function exportBK(){
  try{
    const all=(await dbAll()).sort((a,b)=>a.id-b.id);
    const parts=[enc.encode('TVBK1')];
    const push=(h,b)=>{const hb=enc.encode(JSON.stringify(h)),n=new Uint8Array(4);new DataView(n.buffer).setUint32(0,hb.length);parts.push(n,hb);if(b)parts.push(b)};
    let logo='',txt='';try{logo=localStorage.getItem('logo')||'';txt=localStorage.getItem('txt')||''}catch(e){}
    push({kind:'meta',logo,txt,size:0});
    all.forEach(o=>push(o.blob?{kind:o.kind,type:o.type,name:o.name,size:o.blob.size,mime:o.blob.type}:{kind:o.kind,type:'yt',name:o.name,src:o.src,dur:o.dur,size:0},o.blob));
    const name='tv-backup-'+new Date().toISOString().slice(0,10)+'.tvbackup';
    if(window.showSaveFilePicker){
      const fh=await showSaveFilePicker({suggestedName:name}),w=await fh.createWritable();
      for(const p of parts)await w.write(p);
      await w.close();
    }else{
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(parts));a.download=name;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),120000);
    }
    alert('✅ បម្រុងទុកបានជោគជ័យ');
  }catch(e){if(e.name!='AbortError')alert('⚠️ បម្រុងទុកមិនបាន៖ '+e.message)}
}
async function importBK(i){
  const f=i.files[0];i.value='';if(!f)return;
  try{
    if(dec.decode(await f.slice(0,5).arrayBuffer())!='TVBK1')throw new Error('ឯកសារមិនត្រឹមត្រូវ');
    const have=new Set((await dbAll()).map(o=>[o.kind,o.name,o.blob?o.blob.size:o.src].join('|')));
    let off=5,n=0;
    while(off<f.size){
      const len=new DataView(await f.slice(off,off+4).arrayBuffer()).getUint32(0);off+=4;
      const h=JSON.parse(dec.decode(await f.slice(off,off+len).arrayBuffer()));off+=len;
      if(h.kind=='meta'){
        try{if(h.logo){localStorage.setItem('logo',h.logo);$('logo').src=h.logo;$('logo').classList.remove('hide')}
        if(h.txt){localStorage.setItem('txt',h.txt);$('txt').value=h.txt;setTick()}}catch(e){}
        continue;
      }
      const blob=h.size?f.slice(off,off+h.size,h.mime):null;off+=h.size;
      const key=[h.kind,h.name,h.size?h.size:h.src].join('|');
      if(have.has(key))continue;
      const o=blob?{kind:h.kind,type:h.type,name:h.name,blob}:{kind:h.kind,type:'yt',name:h.name,src:h.src,dur:h.dur};
      o.id=await dbPut(o);have.add(key);n++;
      const v=blob?{id:o.id,type:o.type,name:o.name,src:URL.createObjectURL(blob)}:{id:o.id,type:'yt',src:o.src,name:o.name,dur:o.dur};
      (o.kind=='ad'?ads:items).push(v);
    }
    draw();showStore();alert('✅ ស្ដារបាន '+n+' ធាតុថ្មី');
  }catch(e){alert('⚠️ ស្ដារមិនបាន៖ '+e.message)}
}
async function init(){
  try{
    await new Promise((res,rej)=>{const r=indexedDB.open('tvstation',1);r.onupgradeneeded=()=>r.result.createObjectStore('m',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
    (await dbAll()).sort((a,b)=>a.id-b.id).forEach(o=>{
      if(o.type=='yt')items.push({id:o.id,type:'yt',src:o.src,name:o.name,dur:o.dur});
      else{const v={id:o.id,type:o.type,name:o.name,src:URL.createObjectURL(o.blob)};(o.kind=='ad'?ads:items).push(v)}
    });
    draw();
  }catch(e){$('store').textContent='⚠️ មិនអាចប្រើឃ្លាំងផ្ទុកអចិន្ត្រៀយ៍បានទេ (សូមបើកតាម http://localhost ឬ https)'}
  showStore();
}
function addYT(){
  const u=$('yt').value.trim();
  const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if(!m){alert('តំណ YouTube មិនត្រឹមត្រូវ');return}
  const o={kind:'item',type:'yt',src:m[1],name:'YouTube: '+m[1],dur:+$('ytd').value||60};
  dbPut(o).then(id=>{o.id=id}).catch(()=>{}).finally(()=>{items.push(o);draw();showStore()});$('yt').value='';
}
function draw(){
  $('items').innerHTML='';$('ads').innerHTML='';
  items.forEach((it,i)=>{const d=document.createElement('div');
    d.innerHTML=(it.type=='img'?`<img src="${it.src}">`:it.type=='vid'?'🎞️':'▶️')+'<span></span><button class="btn r">✕</button>';
    d.querySelector('span').textContent=it.name;d.querySelector('button').onclick=()=>{if(confirm('លុបធាតុនេះចេញជាអចិន្ត្រៀយ៍?')){if(it.id)dbDel(it.id).catch(()=>{});items.splice(i,1);draw();showStore()}};$('items').appendChild(d)});
  ads.forEach((it,i)=>{const d=document.createElement('div');
    d.innerHTML=`<img src="${it.src}"><span></span><button class="btn r">✕</button>`;
    d.querySelector('span').textContent=it.name;d.querySelector('button').onclick=()=>{if(confirm('លុបពាណិជ្ជកម្មនេះចេញជាអចិន្ត្រៀយ៍?')){if(it.id)dbDel(it.id).catch(()=>{});ads.splice(i,1);draw();showStore()}};$('ads').appendChild(d)});
}
function setTick(){
  const t=$('txt').value.trim();
  try{localStorage.setItem('txt',t)}catch(e){}
  $('tick').classList.toggle('hide',!t);$('tickt').textContent=t;
  $('tickt').style.animationDuration=($('spd').value||15)+'s';
}
function next(){
  if(!running||!items.length)return;
  const it=items[idx%items.length];idx++;
  const s=$('screen');s.innerHTML='';
  if(it.type=='img'){s.innerHTML=`<img class="m" src="${it.src}">`;timer=setTimeout(next,(+$('dur').value||8)*1000)}
  else if(it.type=='vid'){const v=document.createElement('video');v.src=it.src;v.autoplay=true;v.playsInline=true;v.controls=false;v.onended=next;v.onerror=next;s.appendChild(v);v.play().catch(()=>{})}
  else{s.innerHTML=`<iframe src="https://www.youtube.com/embed/${it.src}?autoplay=1&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;timer=setTimeout(next,it.dur*1000)}
}
function startST(){
  if(!items.length){alert('សូមបន្ថែមរូបថត វីដេអូ ឬ YouTube មុន');return}
  stopST();running=true;idx=0;setTick();next();
  let a=0;
  const showAd=()=>{const el=$('ad');if(!ads.length){el.classList.add('hide');return}
    el.src=ads[a++%ads.length].src;el.classList.remove('hide')};
  showAd();adTimer=setInterval(showAd,10000);
}
function stopST(){running=false;clearTimeout(timer);clearInterval(adTimer);$('screen').innerHTML='';$('ad').classList.add('hide')}
/* ===== ចុះឈ្មោះ Gmail / admin (ក្នុង index.html) ===== */
const H=s=>{let a=3735928559,b=1103547991;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(16)};
const ADMIN_H='26214783468e3'; // hash only — the admin name itself is not written in this file
const GM=/^[\w.+-]{3,64}@gmail\.com$/i;
const getUsers=()=>{try{return JSON.parse(localStorage.getItem('users')||'[]')}catch(e){return[]}};
function join(){
  const v=$('who').value.replace(/[\u200B-\u200D\uFEFF]/g,'').trim();$('who').value='';if(!v)return;
  const m=$('msg');
  if(H(v)===ADMIN_H){$('adm').classList.remove('hide');m.style.color='#3fb950';m.textContent='(ត្រឹមត្រូវហើយ)';return}
  if(GM.test(v)){
    const e=v.toLowerCase(),u=getUsers();
    if(!u.some(x=>x.email==e)){u.push({email:e,time:new Date().toISOString()});try{localStorage.setItem('users',JSON.stringify(u))}catch(x){}}
    try{localStorage.setItem('reg',e)}catch(x){}
    m.style.color='#3fb950';m.textContent='✅ ឧបករណ៍នេះចុះឈ្មោះបានសម្រេច';return;
  }
  m.style.color='#f85149';m.textContent='⚠️ សូមបញ្ចូល Gmail ឲ្យត្រឹមត្រូវ';
}
function showUsers(){
  const u=getUsers(),L=$('users');L.innerHTML='';
  u.forEach(x=>{const d=document.createElement('div');d.textContent=x.email+'  ·  '+x.time.slice(0,10);L.appendChild(d)});
  if(!u.length)L.innerHTML='<div>គ្មាន</div>';
}
$('who').addEventListener('keydown',e=>{if(e.key=='Enter')join()});
try{const r=localStorage.getItem('reg');if(r){$('msg').style.color='#3fb950';$('msg').textContent='✅ ឧបករណ៍នេះបានចុះឈ្មោះរួចហើយ ('+r+')'}}catch(e){}

init();
try{const l=localStorage.getItem('logo');if(l){$('logo').src=l;$('logo').classList.remove('hide')}
const t=localStorage.getItem('txt');if(t){$('txt').value=t;setTick()}}catch(e){}
</script>
