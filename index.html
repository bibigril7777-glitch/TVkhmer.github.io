<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ទូរទស្សន៍ IPTV និងស្ថានីយផ្ទាល់ខ្លួន</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Khmer OS","Noto Sans Khmer",system-ui,sans-serif;background:#0d1117;color:#e6edf3}
header{display:flex;gap:8px;padding:10px;background:#161b22;position:sticky;top:0;z-index:9}
header button{flex:1;padding:12px;border:0;border-radius:8px;background:#21262d;color:#e6edf3;font-size:16px}
header button.on{background:#e50914}
main{padding:10px;max-width:1000px;margin:auto}
.hide{display:none}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.stage video,.stage iframe,.stage img.m{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border:0;background:#000}
#logo{position:absolute;top:8px;right:8px;max-height:15%;max-width:20%;z-index:3}
#ad{position:absolute;left:8px;bottom:34px;max-height:28%;max-width:35%;z-index:3;border-radius:6px;border:2px solid #fff}
#pt{position:absolute;top:8px;left:8px;z-index:3;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:6px;font-size:14px}
.tick{position:absolute;left:0;right:0;bottom:0;height:28px;background:rgba(200,0,0,.85);overflow:hidden;z-index:4;white-space:nowrap}
.tick span{display:inline-block;padding-left:100%;line-height:28px;font-weight:bold;animation:t 15s linear infinite}
@keyframes t{to{transform:translateX(-100%)}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
select,input[type=text],input[type=search],input[type=number],input[type=time],textarea{flex:1;min-width:110px;padding:10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;font-size:15px}
.btn{padding:10px 14px;border:0;border-radius:8px;background:#238636;color:#fff;font-size:15px;cursor:pointer}
.btn.r{background:#da3633}.btn.b{background:#1f6feb}
.list{max-height:320px;overflow:auto;background:#161b22;border-radius:8px}
.list div{padding:10px;border-bottom:1px solid #21262d;cursor:pointer;display:flex;gap:8px;align-items:center}
.list span{flex:1}
h3{margin:18px 0 6px}
small{color:#8b949e}
.card{background:#161b22;border-radius:10px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<header>
  <button id="t1" class="on" onclick="tab(1)">📺 ទូរទស្សន៍ពិភពលោក</button>
  <button id="t2" onclick="tab(2)">🎬 ស្ថានីយខ្ញុំ</button>
</header>
<main>

<section id="p1">
  <div class="stage"><video id="tv" controls autoplay playsinline></video></div>
  <p id="now"><small>ជ្រើសប៉ុស្តិ៍ខាងក្រោម</small></p>
  <div class="row">
    <select id="country" onchange="loadCountry()"></select>
    <input type="search" id="q" placeholder="ស្វែងរកប៉ុស្តិ៍..." oninput="renderList()">
  </div>
  <div class="list" id="list"></div>
</section>

<section id="p2" class="hide">
  <div class="stage">
    <div id="screen"></div>
    <img id="logo" class="hide" alt="">
    <img id="ad" class="hide" alt="">
    <div id="pt" class="hide"></div>
    <div class="tick hide" id="tick"><span id="tickt"></span></div>
  </div>

  <h3>📅 កាលវិភាគ</h3>
  <div class="list" id="sched"></div>

  <div class="card">
    <div class="row">
      <input type="text" id="who" placeholder="បញ្ចូល Gmail របស់អ្នកដើម្បីចុះឈ្មោះ" autocomplete="off">
      <button class="btn" onclick="join()">យល់ព្រម</button>
    </div>
    <small id="msg">ការចុះឈ្មោះរក្សាទុកតែ Gmail របស់អ្នកប៉ុណ្ណោះ។</small>
  </div>

  <div id="adm" class="hide">
    <div class="card">
      <h3>🏷️ Logo</h3><input type="file" accept="image/*" onchange="up(this,'logo')">
      <h3>🖼️🎞️ រូបថត / វីដេអូ</h3><input type="file" accept="image/*,video/*" multiple onchange="up(this,'item')">
      <h3>▶️ តំណ YouTube</h3>
      <div class="row"><input type="text" id="yt" placeholder="https://youtube.com/watch?v=..."><button class="btn b" onclick="addYT()">បន្ថែម</button></div>
      <div class="list" id="items"></div>
    </div>
    <div class="card">
      <h3>📢 ពាណិជ្ជកម្ម</h3><input type="file" accept="image/*" multiple onchange="up(this,'ad')">
      <div class="list" id="ads"></div>
    </div>
    <div class="card">
      <h3>📝 អក្សរហូរ</h3>
      <textarea id="txt" rows="2" placeholder="សរសេរអត្ថបទ..."></textarea>
      <div class="row"><input type="number" id="spd" value="15" min="4"><button class="btn" onclick="saveTick()">រក្សាទុក</button></div>
    </div>
    <div class="card">
      <h3>🗓️ បន្ថែមកាលវិភាគ</h3>
      <div class="row"><select id="sd"></select><input type="time" id="st" value="08:00"></div>
      <div class="row"><input type="text" id="sti" placeholder="ចំណងជើង"><select id="si"></select></div>
      <button class="btn" onclick="addSch()">បន្ថែម</button>
    </div>
    <div class="card">
      <h3>💾 បម្រុងទុក / ស្ដារ</h3>
      <div class="row"><button class="btn b" onclick="mkBK()">បម្រុងទុកឥឡូវនេះ</button></div>
      <div class="row"><select id="bks"></select><button class="btn r" onclick="rsBK()">ស្ដារ</button></div>
      <h3>👥 អ្នកចុះឈ្មោះ</h3>
      <button class="btn b" onclick="showUsers()">បង្ហាញបញ្ជី</button>
      <div class="list" id="users"></div>
    </div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const SV=location.protocol.startsWith('http')?'':'http://localhost:3000';
const DAYS=['ច័ន្ទ','អង្គារ','ពុធ','ព្រហស្បតិ៍','សុក្រ','សៅរ៍','អាទិត្យ'];
$('sd').innerHTML=DAYS.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
function tab(n){$('p1').classList.toggle('hide',n!=1);$('p2').classList.toggle('hide',n!=2);$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)$('tv').pause()}

/* ===== ទូរទស្សន៍ពិភពលោក ===== */
const C={kh:'🇰🇭 កម្ពុជា',cn:'🇨🇳 ចិន',vn:'🇻🇳 វៀតណាម',la:'🇱🇦 ឡាវ',mm:'🇲🇲 មីយ៉ាន់ម៉ា',sg:'🇸🇬 សិង្ហបុរី',jp:'🇯🇵 ជប៉ុន',kr:'🇰🇷 កូរ៉េខាងត្បូង',kp:'🇰🇵 កូរ៉េខាងជើង',us:'🇺🇸 សហរដ្ឋអាមេរិក',ru:'🇷🇺 រុស្ស៊ី',ua:'🇺🇦 អ៊ុយក្រែន',sy:'🇸🇾 ស៊ីរី',za:'🇿🇦 អាហ្វ្រិកខាងត្បូង',iq:'🇮🇶 អ៊ីរ៉ាក់',ir:'🇮🇷 អ៊ីរ៉ង់',il:'🇮🇱 អ៊ីស្រាអែល',se:'🇸🇪 ស៊ុយអែត',in:'🇮🇳 ឥណ្ឌា',tw:'🇹🇼 តៃវ៉ាន់',id:'🇮🇩 ឥណ្ឌូនេស៊ី',ph:'🇵🇭 ហ្វីលីពីន',my:'🇲🇾 ម៉ាឡេស៊ី',eng:'🇬🇧 អង់គ្លេស (ភាសា)',es:'🇪🇸 អេស្ប៉ាញ',qa:'🇶🇦 កាតា'};
const SRV={kh:'cambodia',mm:'myanmar',in:'indian',cn:'chinese',tw:'taiwan',id:'indonesia',ru:'russian',ph:'philippines',my:'malaysian',jp:'japanese',us:'america',eng:'english',es:'spain',ua:'ukraine',ir:'iran',iq:'iraq',qa:'qatar',vn:'vietnam',la:'laos',sg:'singapore',kr:'southkorea',kp:'northkorea',sy:'syria',za:'southafrica',il:'israel',se:'sweden'};
$('country').innerHTML=Object.entries(C).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
let chans=[],hls;
async function loadCountry(){
  $('list').innerHTML='<div>កំពុងផ្ទុក...</div>';
  try{
    const k=$('country').value;let r=null;
    {try{r=await fetch(`${SV}/playlist/${SRV[k]}.m3u8`);if(!r.ok)r=null}catch(e){r=null}}
    if(!r)r=await fetch(`https://iptv-org.github.io/iptv/${k=='eng'?'languages':'countries'}/${k}.m3u`);
    if(!r.ok)throw 0;
    const L=(await r.text()).split('\n');chans=[];
    for(let i=0;i<L.length;i++)if(L[i].startsWith('#EXTINF')){
      const name=L[i].split(',').pop().trim();let j=i+1;while(L[j]&&L[j].startsWith('#'))j++;
      if(L[j]&&L[j].startsWith('http'))chans.push({name,url:L[j].trim()});
    }
  }catch(e){chans=[]}
  renderList();
}
function renderList(){
  const q=$('q').value.toLowerCase(),f=chans.filter(c=>c.name.toLowerCase().includes(q));
  $('list').innerHTML=f.length?'':'<div>គ្មានប៉ុស្តិ៍ទេ</div>';
  f.forEach(c=>{const d=document.createElement('div');d.textContent='📺 '+c.name;d.onclick=()=>play(c);$('list').appendChild(d)});
}
function play(c){
  const v=$('tv');$('now').innerHTML='កំពុងចាក់: <b></b>';$('now').querySelector('b').textContent=c.name;
  if(hls){hls.destroy();hls=null}
  if(Hls.isSupported()){hls=new Hls();hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$('now').innerHTML='<small>⚠️ ប៉ុស្តិ៍នេះមិនអាចចាក់បាន</small>'})}
  else v.src=c.url;
  v.play().catch(()=>{});
}
loadCountry();

/* ===== ស្ថានីយខ្ញុំ (ទិន្នន័យពី Server.js) ===== */
let S={items:[],ads:[],schedule:[]},TK='',curKey='',adI=0;
const api=(p,o={})=>fetch(SV+p,{...o,headers:{'x-token':TK,'content-type':'application/json',...(o.headers||{})}}).then(r=>r.json());

async function load(){
  try{S=await (await fetch(SV+'/api/state')).json()}catch(e){$('sched').innerHTML='<div>⚠️ មិនអាចភ្ជាប់ Server។ សូមដំណើរការ node Server.js រួចបើក http://localhost:3000</div>';return}
  if(S.logo)S.logo=SV+S.logo;S.items.forEach(i=>i.url=i.url&&SV+i.url);S.ads.forEach(i=>i.url=SV+i.url);
  $('logo').classList.toggle('hide',!S.logo);if(S.logo)$('logo').src=S.logo;
  $('tick').classList.toggle('hide',!S.ticker);$('tickt').textContent=S.ticker;$('tickt').style.animationDuration=S.speed+'s';
  if(TK){$('txt').value=S.ticker;$('spd').value=S.speed}
  lists();checkSched();
}
function row(t,onDel){const d=document.createElement('div');d.innerHTML='<span></span>';d.firstChild.textContent=t;
  if(onDel){const b=document.createElement('button');b.className='btn r';b.textContent='✕';b.onclick=()=>confirm('លុប?')&&onDel();d.appendChild(b)}return d}
function lists(){
  const nm=id=>(S.items.find(i=>i.id==id)||{}).name||'?';
  $('sched').innerHTML='';
  S.schedule.forEach(s=>$('sched').appendChild(row(`${DAYS[s.day]} ${s.time} — ${s.title||nm(s.itemId)}`,TK&&(()=>del('schedule',s.id)))));
  if(!S.schedule.length)$('sched').innerHTML='<div>មិនទាន់មានកាលវិភាគ</div>';
  if(!TK)return;
  $('items').innerHTML='';S.items.forEach(i=>$('items').appendChild(row((i.type=='vid'?'🎞️ ':i.type=='img'?'🖼️ ':'▶️ ')+i.name,()=>del('items',i.id))));
  $('ads').innerHTML='';S.ads.forEach(i=>$('ads').appendChild(row('📢 '+i.name,()=>del('ads',i.id))));
  $('si').innerHTML=S.items.map(i=>`<option value="${i.id}">${i.name.replace(/</g,'&lt;')}</option>`).join('');
}
const del=async(c,id)=>{await api(`/api/${c}/${id}`,{method:'DELETE'});load()};

/* កាលវិភាគស្វ័យប្រវត្តិ */
function current(){
  if(!S.schedule.length)return null;
  const n=new Date(),day=(n.getDay()+6)%7,key=day*1440+n.getHours()*60+n.getMinutes();
  const k=s=>s.day*1440+(+s.time.slice(0,2))*60+(+s.time.slice(3));
  const a=[...S.schedule].sort((x,y)=>k(x)-k(y));
  return a.filter(s=>k(s)<=key).pop()||a[a.length-1];
}
function checkSched(){
  const c=current();if(!c){return}
  const key=c.id+c.itemId+(S.items.find(i=>i.id==c.itemId)||{}).url;if(key==curKey)return;curKey=key;
  const it=S.items.find(i=>i.id==c.itemId),sc=$('screen');sc.innerHTML='';
  $('pt').textContent=`${c.time} ${c.title||''}`;$('pt').classList.remove('hide');
  if(!it)return;
  if(it.type=='vid')sc.innerHTML=`<video src="${it.url}" autoplay loop muted playsinline controls></video>`;
  else if(it.type=='img')sc.innerHTML=`<img class="m" src="${it.url}">`;
  else sc.innerHTML=`<iframe src="https://www.youtube.com/embed/${it.src}?autoplay=1&mute=1&loop=1&playlist=${it.src}&rel=0" allow="autoplay;encrypted-media;fullscreen" allowfullscreen></iframe>`;
}
setInterval(checkSched,15000);setInterval(load,60000);
setInterval(()=>{const a=$('ad');if(!S.ads.length){a.classList.add('hide');return}a.src=S.ads[adI++%S.ads.length].url;a.classList.remove('hide')},10000);

/* ចុះឈ្មោះ Gmail / admin */
const GM=/^[\w.+-]{3,64}@gmail\.com$/i,LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const DEV=LS('dev')||(()=>{const d=Math.random().toString(36).slice(2)+Date.now().toString(36);LS('dev',d);return d})();
/* ចុះឈ្មោះលើឧបករណ៍ភ្លាមៗ (មិនត្រូវការ Server) ហើយផ្ញើទៅ Server ពេលក្រោយដោយស្វ័យប្រវត្តិ */
async function sync(){
  let p=[];try{p=JSON.parse(LS('pend')||'[]')}catch(e){}
  for(const e of [...p]){
    try{const r=await (await fetch(SV+'/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({v:e,d:DEV})})).json();
      if(r.ok){p=p.filter(x=>x!=e);LS('pend',JSON.stringify(p))}}catch(x){break}
  }
}
async function join(){
  const v=$('who').value.replace(/[\u200B-\u200D\uFEFF]/g,'').trim();if(!v)return;
  const m=$('msg');$('who').value='';
  if(GM.test(v)){
    const e=v.toLowerCase();let p=[];try{p=JSON.parse(LS('pend')||'[]')}catch(x){}
    LS('reg',e);if(!p.includes(e)){p.push(e);LS('pend',JSON.stringify(p))}
    m.style.color='#3fb950';m.textContent='✅ ឧបករណ៍នេះចុះឈ្មោះបានសម្រេច';sync();return;
  }
  try{
    const r=await (await fetch(SV+'/api/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({v})})).json();
    m.textContent=r.msg||'';m.style.color=r.ok?'#3fb950':'#f85149';
    if(r.token){TK=r.token;$('adm').classList.remove('hide');$('txt').value=S.ticker;$('spd').value=S.speed;lists();bks()}
  }catch(e){m.style.color='#f85149';m.textContent='⚠️ មិនអាចភ្ជាប់ Server'}
}
if(LS('reg')){$('msg').style.color='#3fb950';$('msg').textContent='✅ ឧបករណ៍នេះបានចុះឈ្មោះរួចហើយ ('+LS('reg')+')'}
sync();setInterval(sync,60000);

/* ផ្នែក admin */
async function up(i,kind){
  const fs=[...i.files];i.value='';$('msg').textContent='កំពុងផ្ទុកឡើង...';
  for(const f of fs)await fetch(`${SV}/api/upload?kind=${kind}&name=${encodeURIComponent(f.name)}`,{method:'POST',headers:{'x-token':TK,'content-type':f.type||'application/octet-stream'},body:f});
  $('msg').textContent='✅ ផ្ទុកឡើងរួច';load();
}
async function addYT(){
  const m=$('yt').value.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
  if(!m)return alert('តំណ YouTube មិនត្រឹមត្រូវ');
  await api('/api/yt',{method:'POST',body:JSON.stringify({src:m[1],dur:60})});$('yt').value='';load();
}
async function saveTick(){await api('/api/ticker',{method:'POST',body:JSON.stringify({text:$('txt').value,speed:+$('spd').value})});load()}
async function addSch(){
  if(!$('si').value)return alert('សូមបន្ថែមវីដេអូ ឬរូបមុន');
  await api('/api/schedule',{method:'POST',body:JSON.stringify({day:+$('sd').value,time:$('st').value,title:$('sti').value,itemId:$('si').value})});$('sti').value='';load();
}
async function bks(){const l=await api('/api/backups');$('bks').innerHTML=l.map(n=>`<option>${n}</option>`).join('')}
async function mkBK(){await api('/api/backup',{method:'POST'});await bks();alert('✅ បម្រុងទុករួច')}
async function rsBK(){if($('bks').value&&confirm('ស្ដារទិន្នន័យពីការបម្រុងទុកនេះ?')){await api('/api/restore',{method:'POST',body:JSON.stringify({name:$('bks').value})});load();alert('✅ ស្ដាររួច')}}
async function showUsers(){const u=await api('/api/users');$('users').innerHTML='';u.forEach(x=>$('users').appendChild(row(x.email+'  ·  '+x.time.slice(0,10))));if(!u.length)$('users').innerHTML='<div>គ្មាន</div>'}
$('who').addEventListener('keydown',e=>{if(e.key=='Enter')join()});
load();
</script>
</body>
</html>
